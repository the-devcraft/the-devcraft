name: Check profile graphics

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - README.md
      - assets/**
      - scripts/**
      - profile.config.json
      - .github/workflows/refresh-profile.yml
  push:
    branches: [main]
    paths:
      - README.md
      - assets/**
      - scripts/validate-profile.mjs
      - scripts/render-profile.mjs
      - profile.config.json
      - .github/workflows/refresh-profile.yml

permissions:
  contents: read

concurrency:
  group: profile-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate profile graphics and references
        run: node scripts/validate-profile.mjs
      - name: Check generated graphic matches configuration
        run: node scripts/render-profile.mjs --check
