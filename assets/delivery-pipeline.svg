<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="490" viewBox="0 0 1100 490" role="img" aria-labelledby="title desc">
<title id="title">From problem to production</title><desc id="desc">Understand: Users, goals &amp; constraints. Plan: Scope, risks &amp; priorities. Design: Interfaces, APIs &amp; data. Build: Small, focused changes. Review: Tests, feedback &amp; refinement. Release: Repeatable, safe delivery. Improve: Observe, learn &amp; iterate. A continuous feedback loop.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b0f17"/><stop offset="1" stop-color="#111722"/></linearGradient><linearGradient id="card" x2="0" y2="1"><stop stop-color="#1c2331"/><stop offset="1" stop-color="#151b26"/></linearGradient><linearGradient id="signal"><stop stop-color="#e8997c"/><stop offset="1" stop-color="#ad9ce7"/></linearGradient></defs>
<style>.signal{stroke-dasharray:7 19;animation:signal 16s linear infinite}.return{stroke-dasharray:3 9;animation:signal 24s linear infinite}@keyframes signal{to{stroke-dashoffset:-208}}@media(prefers-reduced-motion:reduce){.signal,.return{animation:none}}</style>
<rect x="1" y="1" width="1098" height="488" rx="20" fill="url(#bg)" stroke="#30374a"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="40" y="49" fill="#f2f3fa" font-size="25" font-weight="650">From problem to production</text><text x="40" y="77" fill="#9aa6bd" font-size="14">Understand the need. Build deliberately. Keep improving.</text><text x="1059" y="48" text-anchor="end" fill="#8d97b0" font-size="10" letter-spacing="1.6">THE DELIVERY LOOP</text>
