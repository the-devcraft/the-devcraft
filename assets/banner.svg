  <g transform="translate(973 44)" opacity=".65"><g class="float-b"><path d="M0 20 32 2 64 20 32 39Z" fill="#fff" fill-opacity=".45" stroke="#fff" stroke-opacity=".7"/><path d="M0 20 32 39V77L0 58Z" fill="#574680" fill-opacity=".3" stroke="#fff" stroke-opacity=".4"/><path d="M32 39 64 20V58L32 77Z" fill="#fff" fill-opacity=".12" stroke="#fff" stroke-opacity=".5"/></g></g>
