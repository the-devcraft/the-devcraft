<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="210" viewBox="0 0 1100 210" role="img" aria-labelledby="title desc">
  <title id="title">The Dev Craft</title><desc id="desc">Senior Software Engineer. Full Stack Development.</desc>
  <defs><linearGradient id="banner" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#e69d85"/><stop offset=".48" stop-color="#c88e89"/><stop offset="1" stop-color="#969ce7"/></linearGradient></defs>
  <style>
    .float-a{animation:float-a 8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .float-b{animation:float-b 10s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
